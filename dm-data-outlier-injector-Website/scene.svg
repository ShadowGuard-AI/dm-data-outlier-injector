<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The librarian desk in three bands: shelves and window still while window light shifts and dust drifts in the far band, catalogue drawers sliding out one at a time and stopping in the middle band, and a hand lifting the date stamp, pressing it on the ink pad and then on the blank loan card in the near band">
<rect width="900" height="300" fill="#e7dcc0"/>
<!-- far band: shelves and window stay still, light shifts, dust drifts down -->
<rect x="30" y="14" width="110" height="86" fill="#d6e0d6" stroke="#26201a" stroke-width="3"/>
<line x1="67" y1="14" x2="67" y2="100" stroke="#787c6e" stroke-width="2"/><line x1="104" y1="14" x2="104" y2="100" stroke="#787c6e" stroke-width="2"/><line x1="30" y1="57" x2="140" y2="57" stroke="#787c6e" stroke-width="2"/>
<polygon points="90,100 150,100 330,196 210,196" fill="#fff6cd" opacity="0.4">
<animate attributeName="opacity" values="0.25; 0.5; 0.3; 0.25" dur="14s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="14s" repeatCount="indefinite"/></polygon>
<g fill="#5a4230" stroke="#26201a" stroke-width="2"><rect x="620" y="20" width="18" height="52"/><rect x="646" y="14" width="18" height="58" fill="#2f5d3a"/><rect x="672" y="24" width="18" height="48"/><rect x="698" y="18" width="18" height="54" fill="#2f5d3a"/><rect x="724" y="26" width="18" height="46"/></g>
<rect x="610" y="72" width="240" height="6" fill="#26201a"/>
<g fill="#c9a227"><circle cx="120" cy="26" r="2.5"><animate attributeName="cy" values="26; 88; 26" dur="12s" repeatCount="indefinite"/></circle><circle cx="180" cy="40" r="2"><animate attributeName="cy" values="40; 96; 40" dur="15s" repeatCount="indefinite"/></circle><circle cx="230" cy="22" r="2"><animate attributeName="cy" values="22; 80; 22" dur="10s" repeatCount="indefinite"/></circle><circle cx="290" cy="52" r="2.5"><animate attributeName="cy" values="52; 98; 52" dur="13s" repeatCount="indefinite"/></circle></g>
<!-- middle band: catalogue cabinet fixed, drawers slide out one at a time and stop -->
<rect x="330" y="108" width="300" height="86" fill="#2f5d3a" stroke="#26201a" stroke-width="3"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -34 0; -34 0; 0 0" keyTimes="0; 0.2; 0.4; 0.8; 1" dur="11s" repeatCount="indefinite"/>
<rect x="346" y="120" width="128" height="28" fill="#4a7d54" stroke="#26201a" stroke-width="2"/><rect x="382" y="126" width="56" height="10" fill="#f1e8d2"/><ellipse cx="410" cy="142" rx="5" ry="3" fill="none" stroke="#e8c65c" stroke-width="2"/></g>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -34 0; -34 0; 0 0" keyTimes="0; 0.45; 0.65; 0.9; 1" dur="11s" repeatCount="indefinite"/>
<rect x="490" y="120" width="128" height="28" fill="#4a7d54" stroke="#26201a" stroke-width="2"/><rect x="526" y="126" width="56" height="10" fill="#f1e8d2"/><ellipse cx="554" cy="142" rx="5" ry="3" fill="none" stroke="#e8c65c" stroke-width="2"/></g>
<g fill="#f1e8d2" stroke="#26201a"><rect x="360" y="160" width="22" height="26"/><rect x="392" y="156" width="22" height="30"/><rect x="424" y="160" width="22" height="26"/><rect x="520" y="160" width="22" height="26"/><rect x="552" y="156" width="22" height="30"/><rect x="584" y="160" width="22" height="26"/></g>
<rect x="346" y="156" width="128" height="30" fill="#1e3d26" stroke="#26201a" stroke-width="2"/><rect x="490" y="156" width="128" height="30" fill="#1e3d26" stroke="#26201a" stroke-width="2"/>
<!-- near band: desk, ink pad, blank loan card, and the stamp worked by a hand -->
<rect x="0" y="206" width="900" height="94" fill="#7a4a2b"/>
<rect x="120" y="238" width="90" height="26" fill="#26201a"/><rect x="128" y="243" width="74" height="12" fill="#34343c"/>
<rect x="560" y="232" width="210" height="52" fill="#f1e8d2" stroke="#26201a" stroke-width="2"/>
<line x1="578" y1="250" x2="752" y2="250" stroke="#d6c6a4" stroke-width="2"/><line x1="578" y1="266" x2="752" y2="266" stroke="#d6c6a4" stroke-width="2"/>
<rect x="640" y="240" width="52" height="20" fill="#8a2f2a" opacity="0"><animate attributeName="opacity" values="0; 0; 0; 0.55; 0.55" keyTimes="0; 0.55; 0.62; 0.7; 1" dur="9s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -195 -6; -195 8; -195 0; 65 -6; 65 10; 65 0; 0 0" keyTimes="0; 0.15; 0.3; 0.4; 0.5; 0.62; 0.7; 0.82; 1" dur="9s" repeatCount="indefinite"/>
<rect x="330" y="252" width="130" height="22" fill="#2f5d3a" stroke="#26201a" stroke-width="2"/>
<line x1="330" y1="252" x2="460" y2="252" stroke="#e8c65c" stroke-width="3"/>
<rect x="338" y="274" width="114" height="10" fill="#1e1a18"/>
<polygon points="382,252 418,252 408,222 392,222" fill="#54301a" stroke="#26201a" stroke-width="2"/>
<ellipse cx="400" cy="216" rx="20" ry="7" fill="#c9a227" stroke="#26201a" stroke-width="2"/>
<circle cx="400" cy="188" r="27" fill="#9c683e" stroke="#26201a" stroke-width="2"/>
<path d="M427 176 L486 158 L492 176 L434 196 Z" fill="#d8b47a" stroke="#26201a" stroke-width="2"/>
</g>
</svg>
